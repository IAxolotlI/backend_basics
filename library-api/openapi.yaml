openapi: 3.1.0
info:
  title: Library API
  version: 1.0.0
  description: |
    Сервис «Библиотека». Выдача только при available_copies > 0 и не более 5 активных выдач на читателя. Возврат — POST /loans/{id}/return. due_date новой выдачи должна быть позже текущей даты. available_copies вычисляется сервером.

servers:
  - url: https://api.library.example/v1/

tags:
  - name: Books
    description: Книги
  - name: Readers
    description: Читатели
  - name: Loans
    description: Выдачи

security:
  - BearerAuth: []

paths:
  /books:
    get:
      tags: [Books]
      summary: Список книг
      operationId: listBooks
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: author
          in: query
          schema: { type: string }
        - name: title
          in: query
          schema: { type: string }
        - name: isbn
          in: query
          schema: { type: string }
        - name: available
          in: query
          schema: { type: boolean }
        - name: sort
          in: query
          schema:
            type: string
            enum: [title:asc, title:desc, published_year:asc, published_year:desc]
            default: title:asc
      responses:
        '200':
          description: Список книг
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookList'
              examples:
                booksList:
                  summary: Пример списка
                  value:
                    items:
                      - id: 1
                        title: "Мастер и Маргарита"
                        author: "Михаил Булгаков"
                        isbn: "978-5-04-118620-5"
                        published_year: 1967
                        total_copies: 5
                        available_copies: 2
                    page: 1
                    limit: 20
                    total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Books]
      summary: Создать книгу
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreate'
            examples:
              createBook:
                summary: Новая книга
                value:
                  title: "1984"
                  author: "Джордж Оруэлл"
                  isbn: "978-5-17-118880-4"
                  published_year: 1949
                  total_copies: 3
      responses:
        '201':
          description: Книга создана
          headers:
            Location:
              description: URL созданного ресурса
              schema: { type: string, format: uri }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'

  /books/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Books]
      summary: Получить книгу
      operationId: getBook
      responses:
        '200':
          description: Книга
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Books]
      summary: Обновить книгу
      operationId: updateBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookUpdate'
      responses:
        '200':
          description: Обновлённая книга
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Books]
      summary: Удалить книгу
      operationId: deleteBook
      responses:
        '204':
          description: Удалено
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /readers:
    get:
      tags: [Readers]
      summary: Список читателей
      operationId: listReaders
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: email
          in: query
          schema: { type: string, format: email }
        - name: full_name
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema:
            type: string
            enum: [registered_at:asc, registered_at:desc, full_name:asc, full_name:desc]
            default: registered_at:desc
      responses:
        '200':
          description: Список читателей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderList'
              examples:
                readersList:
                  summary: Пример списка
                  value:
                    items:
                      - id: 1
                        full_name: "Иван Петров"
                        email: "ivan@example.com"
                        registered_at: "2024-01-15T10:00:00Z"
                    page: 1
                    limit: 20
                    total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Readers]
      summary: Создать читателя
      operationId: createReader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReaderCreate'
            examples:
              createReader:
                summary: Новый читатель
                value:
                  full_name: "Анна Смирнова"
                  email: "anna@example.com"
      responses:
        '201':
          description: Читатель создан
          headers:
            Location:
              description: URL созданного ресурса
              schema: { type: string, format: uri }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reader'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /readers/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Readers]
      summary: Получить читателя
      operationId: getReader
      responses:
        '200':
          description: Читатель
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reader'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Readers]
      summary: Обновить читателя
      operationId: updateReader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReaderUpdate'
      responses:
        '200':
          description: Обновлённый читатель
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reader'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Readers]
      summary: Удалить читателя
      operationId: deleteReader
      responses:
        '204':
          description: Удалено
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /loans:
    get:
      tags: [Loans]
      summary: Список выдач
      operationId: listLoans
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [active, overdue, returned]
        - name: book_id
          in: query
          schema: { type: integer, format: int64 }
        - name: reader_id
          in: query
          schema: { type: integer, format: int64 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [loaned_at:asc, loaned_at:desc, due_date:asc, due_date:desc]
            default: loaned_at:desc
      responses:
        '200':
          description: Список выдач
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanList'
              examples:
                overdueLoans:
                  summary: Просроченные выдачи
                  value:
                    items:
                      - id: 5
                        book_id: 1
                        reader_id: 2
                        loaned_at: "2024-02-01T09:00:00Z"
                        due_date: "2024-02-15T09:00:00Z"
                        returned_at: null
                    page: 1
                    limit: 20
                    total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Loans]
      summary: Создать выдачу
      operationId: createLoan
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanCreate'
            examples:
              createLoan:
                summary: Новая выдача
                value:
                  book_id: 1
                  reader_id: 2
                  due_date: "2024-03-01T12:00:00Z"
      responses:
        '201':
          description: Выдача создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Конфликт (Idempotency mismatch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                idempotencyMismatch:
                  summary: Тот же Idempotency-Key с другим телом
                  value:
                    code: IDEMPOTENCY_MISMATCH
                    message: "Idempotency-Key уже использован с другим телом запроса"
                    details: { key: "b3f1c2a0-..." }
        '422':
          description: Нарушение бизнес-правила
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                noCopies:
                  summary: Нет доступных экземпляров
                  value:
                    code: BUSINESS_RULE_VIOLATION
                    message: "Нет доступных экземпляров"

  /loans/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Loans]
      summary: Получить выдачу
      operationId: getLoan
      responses:
        '200':
          description: Выдача
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        '404':
          $ref: '#/components/responses/NotFound'

  /loans/{id}/return:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Loans]
      summary: Вернуть книгу
      operationId: returnLoan
      responses:
        '200':
          description: Книга возвращена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
              examples:
                returned:
                  summary: Возвращённая выдача
                  value:
                    id: 5
                    book_id: 1
                    reader_id: 2
                    loaned_at: "2024-02-01T09:00:00Z"
                    due_date: "2024-02-15T09:00:00Z"
                    returned_at: "2024-02-14T18:00:00Z"
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Выдача уже возвращена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                alreadyReturned:
                  summary: Уже возвращена
                  value:
                    code: CONFLICT
                    message: "Выдача уже возвращена"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    LimitParam:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidRequest:
              summary: Неизвестное поле
              value:
                code: INVALID_REQUEST
                message: "Неизвестное поле: foo"
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              summary: Не найдено
              value:
                code: NOT_FOUND
                message: "Book с id=999 не найдена"
    Conflict:
      description: Конфликт состояния
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            conflict:
              summary: Нельзя удалить
              value:
                code: CONFLICT
                message: "Нельзя удалить книгу с активными выдачами"
    ValidationError:
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation:
              summary: Пустое имя
              value:
                code: VALIDATION_ERROR
                message: "Поле full_name обязательно"
                details: { field: full_name }

  schemas:
    Book:
      type: object
      required: [id, title, author, isbn, published_year, total_copies, available_copies]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
        title: { type: string, minLength: 1 }
        author: { type: string, minLength: 1 }
        isbn:
          type: string
          deprecated: true
        published_year: { type: integer, minimum: 0 }
        total_copies: { type: integer, minimum: 0 }
        available_copies: { type: integer, minimum: 0, readOnly: true }

    BookCreate:
      type: object
      required: [title, author, isbn, published_year, total_copies]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1 }
        author: { type: string, minLength: 1 }
        isbn: { type: string, pattern: '^[0-9-]{10,17}$' }
        published_year: { type: integer, minimum: 0 }
        total_copies: { type: integer, minimum: 1 }

    BookUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1 }
        author: { type: string, minLength: 1 }
        isbn: { type: string }
        published_year: { type: integer, minimum: 0 }
        total_copies: { type: integer, minimum: 0 }

    BookList:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Book' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }

    Reader:
      type: object
      required: [id, full_name, email, registered_at]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
        full_name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        registered_at: { type: string, format: date-time, readOnly: true }

    ReaderCreate:
      type: object
      required: [full_name, email]
      additionalProperties: false
      properties:
        full_name: { type: string, minLength: 1 }
        email: { type: string, format: email }

    ReaderUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        full_name: { type: string, minLength: 1 }
        email: { type: string, format: email }

    ReaderList:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Reader' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }

    Loan:
      type: object
      required: [id, book_id, reader_id, loaned_at, due_date, returned_at]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
        book_id: { type: integer, format: int64 }
        reader_id: { type: integer, format: int64 }
        loaned_at: { type: string, format: date-time, readOnly: true }
        due_date: { type: string, format: date-time }
        returned_at:
          type: [string, 'null']
          format: date-time

    LoanCreate:
      type: object
      required: [book_id, reader_id, due_date]
      additionalProperties: false
      properties:
        book_id: { type: integer, format: int64 }
        reader_id: { type: integer, format: int64 }
        due_date: { type: string, format: date-time }

    LoanList:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Loan' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }

    ErrorResponse:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - NOT_FOUND
            - VALIDATION_ERROR
            - CONFLICT
            - BUSINESS_RULE_VIOLATION
            - IDEMPOTENCY_MISMATCH
        message: { type: string }
        details:
          type: object
          additionalProperties: true
